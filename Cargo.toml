[package]
name = "corebyte"
version = "6.5.0"
edition = "2021"
description = "CoreByte (CB) Sovereign Layer-1 Blockchain Node & Miner"

[[bin]]
name = "block"
path = "src/main.rs"

[[bin]]
name = "miner"
path = "src/bin/miner.rs"

[dependencies]
actix-web = "4.4"
actix-ws = "0.2"
futures-util = "0.3"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
sha2 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"
num_cpus = "1.16"
reqwest = { version = "0.11", features = ["json"] }

# Production-Grade P2P Networking (Libp2p Stack)
libp2p = { version = "0.53", features = ["tokio", "gossipsub", "kad", "identify", "noise", "tcp", "yamux", "macros"] }